var LINKS={
ham:{v:'https://www.tiktok.com/@/video/7708890003270536462',r:'https://recime.app/p/be907628-e598-4205-9df2-4dcca22b650f'},

function rxFor(t){t=t.toLowerCase();
if(/\byams?\b/.test(t))return 'yam';
if(/cobbler/.test(t)&&!/pies/.test(t))return 'cob';
if(/\bpies?\b|crust|sweet potato/.test(t))return 'pie';
if(/turkey leg|greens/.test(t))return '';
if(/potatoes in/.test(t))return 'pot';
if(/buttered 9×13/.test(t))return 'mac';
if(/\bham\b|sugar blend|glaze jar|make the glaze|broil|glaze off|pat about|pat on about/.test(t))return 'ham';
if(/turkey|baste/.test(t))return 'tky';
if(/\bmac\b|noodle|whisk and stir|sour cream|seasonings and cheese/.test(t))return 'mac';
if(/potato|bacon|mash|warm the cream/.test(t))return 'pot';
return ''}

var PRE=['Turkey breast in the fridge if it is frozen','Ham in the fridge if it is frozen','Wash, stem and chop the collard greens','Shred cheese for the mac and cheese','Shred sharp cheddar for the potatoes','Mix the ham sugar blend in one container','Ham glaze jar','Make the turkey compound butter',
'Oven to 425°. Poke holes in 4 sweet potatoes, set on parchment','Pie sweet potatoes in, 1 hour','Peel and cut 7 Yukon Gold potatoes','OUT: sweet potatoes. Oven to 350°.','Poke the 2 crusts with a fork. Pre-bake 10 minutes.','Peel the sweet potatoes and blend the filling','OUT: crusts. Make the cobbler.','Pour the pies. Pies and cobbler in at 350°.','Butter and season the turkey','Check the cobbler','OUT: pies. Cool on the counter. Oven to 375°.','Mix the cornbread','Cornbread in, 27–29 minutes','OUT: cornbread. Cool completely.'];
var DAYPLAN=[['Until 9:00','','rest','Free morning'],['9:00','9:05','busy','Ham out of the fridge'],['9:05','9:45','rest','Break'],['9:45','10:35','busy','Ham in, start the yams'],['10:35','11:00','rest','Break'],['11:00','11:20','busy','Finish yams, turkey pan liquid'],['11:20','11:35','rest','Break'],['11:35','12:48','busy','Nonstop: ham glaze, mac, potatoes'],['12:48','1:08','rest','Break (greens on at 1:00)'],['1:08','1:27','busy','Baste, check mac and turkey'],['1:27','1:38','rest','Break'],['1:38','2:00','busy','Everything out, carve, slice'],['2:00','','eat','Dinner']];

var TABS=[{id:'rx',tab:'Recipes'}].concat(DAYS.map(function(d){return {id:d.id,tab:d.tab}})).concat([{id:'gear',tab:'Gear'}]);
var KEY='tg26-v3',saved={},open={},rxOpen={};
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
var tabs=document.getElementById('tabs'),panel=document.getElementById('panel'),cur='rx';
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function title(t){return esc(t).replace(/OUT:\s*/g,'<span class="pill">Out</span>').replace(/IN:\s*/g,'<span class="pill">In</span>')}
function chips(id,small){var L=LINKS[id];if(!L)return '';return '<div class="lk">'+(L.v?'<a href="'+L.v+'" target="_blank" rel="noopener">▶ Video</a>':'')+(L.r?'<a href="'+L.r+'" target="_blank" rel="noopener">Recipe</a>':'')+'</div>'}
function isOn(k,t){return saved[k]===1||(saved[k]!==0&&t!==undefined&&PRE.indexOf(t)>=0)}
function cb(k,on){if(on===undefined)on=saved[k]===1;return '<input type="checkbox" aria-label="Done" data-k="'+k+'"'+(on?' checked':'')+'>'}
function drawRx(){
  var h='<div class="card"><h2>Recipes</h2><p class="prog">Tap a recipe. Tick each ingredient once you have it.</p></div>';
  RECIPES.forEach(function(r){
    var n=0,k=0;r.ing.forEach(function(x,i){if(x[0]!=='#'){n++;if(saved['r-'+r.id+'-'+i])k++}});
    h+='<details class="rx" data-rx="'+r.id+'"'+(rxOpen[r.id]?' open':'')+'><summary><span class="rxn"><b>'+esc(r.name)+'</b><span>'+esc(r.when)+'</span></span><span class="cnt'+(k===n?' all':'')+'">'+(k===n?'All set':k+' of '+n)+'</span></summary><div class="rxb">'+chips(r.id)+'<p class="sub">Ingredients</p>';
    r.ing.forEach(function(x,i){if(x[0]==='#'){h+='<p class="sub">'+esc(x.slice(1))+'</p>';return}var key='r-'+r.id+'-'+i;h+='<label class="ing'+(saved[key]?' done':'')+'">'+cb(key)+'<span>'+esc(x)+'</span></label>'});
    h+='<p class="sub">How to make it</p><ol>'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>'+(r.note?'<p class="note">'+esc(r.note)+'</p>':'')+'</div></details>';
  });
  return h;
}
function drawGear(){
  var k=0;GEAR.forEach(function(g,i){if(saved['g-'+i])k++});
  var h='<div class="card"><h2>Gear and extras</h2><p class="prog">'+k+' of '+GEAR.length+' ready</p>';
  GEAR.forEach(function(g,i){var key='g-'+i;h+='<label class="ing'+(saved[key]?' done':'')+'">'+cb(key)+'<span>'+esc(g)+'</span></label>'});
  return h+'</div>';
}
function itemHTML(it,id,on){var dd=it[3];return '<div class="item'+(on?' done':'')+'">'+cb(id,on)+'<div class="body"><div class="tbtn">'+(it[0]?'<span class="tm">'+esc(it[0])+'</span>':'')+title(it[1])+'</div>'+chips(rxFor(it[1]+' '+it[2]),1)+(it[2]?'<div class="amt">'+esc(it[2])+'</div>':'')+(dd?'<div class="d">'+esc(dd)+'</div>':'')+'</div></div>'}
function drawDay(d){
  var n=0,k=0,done=[];d.groups.forEach(function(g,gi){g.items.forEach(function(it,ii){if(it[1]==='BREAK')return;n++;if(isOn(d.id+'-'+gi+'-'+ii,it[1]))k++})});
  var h='<div class="card"><h2>'+esc(d.title)+'</h2><p class="prog">'+k+' of '+n+' done · '+esc(d.sub)+'</p>';
  if(d.id==='thu')h+='<p class="group">Your day at a glance</p><div class="glance">'+DAYPLAN.map(function(x){return '<div class="gl '+x[2]+'"><b>'+esc(x[0])+(x[1]?'–'+esc(x[1]):'')+'</b><span>'+esc(x[3])+'</span></div>'}).join('')+'</div>';
  d.groups.forEach(function(g,gi){
    var body='';
    g.items.forEach(function(it,ii){
      var id=d.id+'-'+gi+'-'+ii;
      if(it[1]==='BREAK'){body+='<div class="brk"><span class="tm">'+esc(it[0])+'</span><b>Break</b> · '+esc(it[2])+'</div>';return}
      var on=isOn(id,it[1]);if(on){done.push([it,id]);return}
      body+=itemHTML(it,id,false);
    });
    if(body.replace(/<div class="brk">.*?<\/div>/g,'').length)h+='<p class="group">'+esc(g.g)+'</p>'+body;
    else if(body)h+=body;
  });
  if(done.length)h+='<p class="group">Done ('+done.length+')</p>'+done.map(function(x){return itemHTML(x[0],x[1],true)}).join('');
  return h+'</div>';
}
function draw(){
  tabs.innerHTML=TABS.map(function(t){return '<button type="button" role="tab" id="tab-'+t.id+'" data-id="'+t.id+'" aria-selected="'+(t.id===cur)+'">'+t.tab+'</button>'}).join('');
  var d=DAYS.filter(function(x){return x.id===cur})[0];
  panel.setAttribute('aria-labelledby','tab-'+cur);
  panel.innerHTML=cur==='rx'?drawRx():cur==='gear'?drawGear():drawDay(d);
}
document.getElementById('notes').innerHTML=NOTES.map(function(n){return '<li>'+n+'</li>'}).join('');
tabs.addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;cur=b.dataset.id;draw();scrollTo(0,0);try{history.replaceState(null,'','#'+cur)}catch(_){}});
panel.addEventListener('click',function(e){var b=e.target.closest('[data-o]');if(!b||b.disabled)return;var k=b.dataset.o;open[k]=!open[k];draw()});
panel.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.rx)rxOpen[d.dataset.rx]=d.open},true);
panel.addEventListener('change',function(e){var k=e.target.dataset.k;if(!k)return;saved[k]=e.target.checked?1:0;persist();var y=scrollY;draw();scrollTo(0,y)});
var hv=(location.hash||'').slice(1);if(TABS.some(function(x){return x.id===hv}))cur=hv;
else{var t=new Date(),dd=t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate();cur=dd===20261125?'wed':dd===20261126?'thu':dd===20261124?'tue':'rx'}
draw();
