{id:'ham',name:'Honeybaked Ham',when:'Thu · bake 10:15, finish 11:43',ing:[

{id:'pot',name:'Layered Loaded Mashed Potatoes',when:'Wed peel · Thu in 1:10',ing:['7 large Yukon Gold potatoes','5 slices bacon','Salt, to taste','1½ cups heavy cream','1 stick salted butter','¾ of a Boursin Garlic & Herb cheese (3 of 4 pieces)','1 tsp garlic powder','1 tsp onion powder','1½ cups shredded sharp cheddar','1 tbsp dried chives'],

{id:'pie',name:'Sweet Potato Pie (2 pies)',when:'Wed night',ing:['4 sweet potatoes','2 Pillsbury 9-inch deep dish pie crusts (1 box)','1 cup brown sugar','1 cup white sugar','1 cup evaporated milk','½ cup (1 stick) Kerrygold unsalted butter, melted','1 tbsp cinnamon','1 tsp nutmeg & allspice','2 tbsp sweetened condensed milk','1 tbsp all-purpose flour','Juice of ½ lemon and ½ orange','3 eggs','Whipped cream, to serve'],

function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
var tabs=document.getElementById('tabs'),panel=document.getElementById('panel'),cur='rx';
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function title(t){return esc(t).replace(/OUT:\s*/g,'<span class="pill">Out</span>').replace(/IN:\s*/g,'<span class="pill">In</span>')}
function cb(k){return '<input type="checkbox" aria-label="Done" data-k="'+k+'"'+(saved[k]?' checked':'')+'>'}
function drawRx(){
  var h='<div class="card"><h2>Recipes</h2><p class="prog">Tap a recipe. Tick each ingredient once you have it.</p></div>';
  RECIPES.forEach(function(r){
    var n=0,k=0;r.ing.forEach(function(x,i){if(x[0]!=='#'){n++;if(saved['r-'+r.id+'-'+i])k++}});
    h+='<details class="rx" data-rx="'+r.id+'"'+(rxOpen[r.id]?' open':'')+'><summary><span class="rxn"><b>'+esc(r.name)+'</b><span>'+esc(r.when)+'</span></span><span class="cnt'+(k===n?' all':'')+'">'+(k===n?'All set':k+' of '+n)+'</span></summary><div class="rxb"><p class="sub">Ingredients</p>';
    r.ing.forEach(function(x,i){if(x[0]==='#'){h+='<p class="sub">'+esc(x.slice(1))+'</p>';return}var key='r-'+r.id+'-'+i;h+='<label class="ing'+(saved[key]?' done':'')+'">'+cb(key)+'<span>'+esc(x)+'</span></label>'});
    h+='<p class="sub">How to make it</p><ol>'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>'+(r.note?'<p class="note">'+esc(r.note)+'</p>':'')+'</div></details>';
  });
  return h;
}
function drawGear(){
  var k=0;GEAR.forEach(function(g,i){if(saved['g-'+i])k++});
  var h='<div class="card"><h2>Gear and extras</h2><p class="prog">'+k+' of '+GEAR.length+' ready</p>';
  GEAR.forEach(function(g,i){var key='g-'+i;h+='<label class="ing'+(saved[key]?' done':'')+'">'+cb(key)+'<span>'+esc(g)+'</span></label>'});
  return h+'</div>';
}
function drawDay(d){
  var n=0,k=0;d.groups.forEach(function(g,gi){g.items.forEach(function(it,ii){n++;if(saved[d.id+'-'+gi+'-'+ii])k++})});
  var h='<div class="card"><h2>'+esc(d.title)+'</h2><p class="prog">'+k+' of '+n+' done · '+esc(d.sub)+'</p>';
  d.groups.forEach(function(g,gi){
    h+='<p class="group">'+esc(g.g)+'</p>';
    g.items.forEach(function(it,ii){
      var id=d.id+'-'+gi+'-'+ii,dd=it[3];
      h+='<div class="item'+(saved[id]?' done':'')+'">'+cb(id)+'<div class="body"><button type="button" class="tbtn" data-o="'+id+'"'+(dd?' aria-expanded="'+!!open[id]+'"':' disabled')+'>'+(it[0]?'<span class="tm">'+esc(it[0])+'</span>':'')+title(it[1])+((dd&&!open[id])?'<span class="more">›</span>':'')+'</button>'+(it[2]?'<div class="amt">'+esc(it[2])+'</div>':'')+((dd&&open[id])?'<div class="d">'+esc(dd)+'</div>':'')+'</div></div>';
    });
  });
  return h+'</div>';
}
function draw(){
  tabs.innerHTML=TABS.map(function(t){return '<button type="button" role="tab" id="tab-'+t.id+'" data-id="'+t.id+'" aria-selected="'+(t.id===cur)+'">'+t.tab+'</button>'}).join('');
  var d=DAYS.filter(function(x){return x.id===cur})[0];
  panel.setAttribute('aria-labelledby','tab-'+cur);
  panel.innerHTML=cur==='rx'?drawRx():cur==='gear'?drawGear():drawDay(d);
}
document.getElementById('notes').innerHTML=NOTES.map(function(n){return '<li>'+n+'</li>'}).join('');
tabs.addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;cur=b.dataset.id;draw();scrollTo(0,0);try{history.replaceState(null,'','#'+cur)}catch(_){}});
panel.addEventListener('click',function(e){var b=e.target.closest('[data-o]');if(!b||b.disabled)return;var k=b.dataset.o;open[k]=!open[k];draw()});
panel.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.rx)rxOpen[d.dataset.rx]=d.open},true);
panel.addEventListener('change',function(e){var k=e.target.dataset.k;if(!k)return;if(e.target.checked)saved[k]=1;else delete saved[k];persist();draw()});
var hv=(location.hash||'').slice(1);if(TABS.some(function(x){return x.id===hv}))cur=hv;
else{var t=new Date(),dd=t.getFullYear()*10000+(t.getMonth()+1)*100+t.getDate();cur=dd===20261125?'wed':dd===20261126?'thu':dd===20261124?'tue':'rx'}
draw();
</script>
</body></html>
